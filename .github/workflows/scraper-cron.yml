name: JobMaxxer Daily Scraper & Supabase Publisher

on:
  schedule:
    # Runs every 6 hours (unlimited free GitHub Actions runs on public repos)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  scrape-and-publish:
    name: Scrape 500+ Sources & Publish to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run High-Throughput Scrapers & Publish to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://jympejesevicwleptfzq.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5bXBlamVzZXZpY3dsZXB0ZnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTU5NzQsImV4cCI6MjEwMjk3MTk3NH0.1b6XFrIxH1hLVdjp2arHLdJ4fkiKV-0gb6yNZ7eMbPA' }}
        run: npx tsx packages/scrapers/src/cron-publisher.ts
